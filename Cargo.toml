[package]
name = "agentmint"
version = "0.1.0"
edition = "2021"
description = "Cryptographic proof that a human authorized an AI agent action"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "sync", "time"] }
axum = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
rand = "0.8"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
chrono = { version = "0.4", features = ["serde"] }
colored = "2"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
jsonwebtoken = "9"
reqwest = { version = "0.11", features = ["json", "stream"] }
url = "2"
webauthn-rs = { version = "0.5.4", features = ["danger-allow-state-serialisation"] }
sha2 = "0.10"
unicode-normalization = "0.1"
hex = "0.4"
crossterm = "0.27"
